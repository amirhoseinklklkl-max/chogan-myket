plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ir.amir.chogan'
    compileSdk 34

    defaultConfig {
        applicationId "ir.amir.chogan"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'

    /* ── ادیوری (Adivery) — طبق مستندات docs.adivery.com/android ── */
    implementation 'com.adivery:sdk:4.9.0'
    // ارسال Google Advertising ID برای هدف‌گیری بهتر تبلیغات
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'

    /* ── پرداخت درون‌برنامه‌ای مایکت ──
       طبق مستندات رسمی مایکت از فایل AIDL و کلاس‌های نمونهٔ TrivialDrive
       (ir.amir.chogan.iap) استفاده شده است — هیچ وابستگی اضافه‌ای لازم نیست. */
}
